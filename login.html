<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Login | Velmora</title>
                <link rel="preconnect" href="https://fonts.googleapis.com">
                <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
                <link rel="stylesheet" href="style.css">
</head>
<body>
        <header>
                <div class="nav">
                         <a class="logo" href="index.html">VELMORA</a>
                         <a class="l" href="index.html">Home</a>
                         <a class="l" href="explore.html">Explore</a>
                         <a class="l" href="contact.html">Contact</a>
                         <a class="l" href="about.html">About</a>
                         <a class="l on" href="login.html">Login</a>
                </div>
        </header>

        <main>
                <section class="login-page">
                <div class="login-box">
                                <span class="eyebrow">Welcome back</span>
                                <h1>Login to Velmora</h1>
                                <hr class="rule">
                                <p class="sub">Sign in to continue your Velmora journey.</p>

                 <form action="#" method="post">
                                <label for="email">Email</label>
                                <input id="email" name="email" type="email" required placeholder="name@example.com">

                                <label for="password">Password</label>
                                <input id="password" name="password" type="password" required placeholder="Enter your password">

                        <div class="login-row">
                                        <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
                                        <a href="#" class="forgot">Forgot password?</a>
                        </div>

                                        <button class="btn login-btn" type="submit">Login</button>
                  </form>

                  <p class="new-user">New to Velmora? <a href="#">Create an account</a></p>
                </div>
                </section>
        </main>

        <footer>Velmora. Luxurious tastes. Legendary characters.</footer>
</body>
</html>
